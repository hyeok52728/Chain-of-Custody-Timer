<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 설정 페이지</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px;}
        button:hover { background-color: #0056b3; }
        .section-title { margin-top: 30px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>
    <h2>모의수사경진대회 시간 설정</h2>
    
    <div class="section-title">⏱️ 실제 대회 시간 (현실)</div>
    <div class="form-group">
        <label>시작 날짜 및 시간</label>
        <input type="datetime-local" id="realStart">
    </div>
    <div class="form-group">
        <label>종료 날짜 및 시간</label>
        <input type="datetime-local" id="realEnd">
    </div>

    <div class="section-title">🕵️ 가상 수사 시간 (시나리오)</div>
    <div class="form-group">
        <label>가상 시작 날짜 및 시간</label>
        <input type="datetime-local" id="virtualStart">
    </div>
    <div class="form-group">
        <label>가상 종료 날짜 및 시간</label>
        <input type="datetime-local" id="virtualEnd">
    </div>
    
    <button id="saveBtn">설정 저장 및 실시간 반영</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // 🔥 본인의 Firebase 설정값으로 변경하세요!
        const firebaseConfig = {
        apiKey: "AIzaSyAwgPkHsoT8QqfU1vxlNhPazlgkJwxgTxA",
        authDomain: "chain-of-custody-53ca7.firebaseapp.com",
        databaseURL: "https://chain-of-custody-53ca7-default-rtdb.firebaseio.com",
        projectId: "chain-of-custody-53ca7",
        storageBucket: "chain-of-custody-53ca7.firebasestorage.app",
        messagingSenderId: "427414747301",
        appId: "1:427414747301:web:9049a7d679cd764b8cb54c",
        measurementId: "G-XGFLK74CFJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('saveBtn').addEventListener('click', () => {
            const realStart = document.getElementById('realStart').value;
            const realEnd = document.getElementById('realEnd').value;
            const virtualStart = document.getElementById('virtualStart').value;
            const virtualEnd = document.getElementById('virtualEnd').value;

            if(!realStart || !realEnd || !virtualStart || !virtualEnd) {
                alert("모든 날짜와 시간을 입력해주세요.");
                return;
            }

            set(ref(db, 'contestSettings'), {
                realStart: realStart,
                realEnd: realEnd,
                virtualStart: virtualStart,
                virtualEnd: virtualEnd
            }).then(() => {
                alert('설정이 성공적으로 저장되었습니다!');
            }).catch((error) => {
                alert('저장 실패: ' + error);
            });
        });
    </script>
</body>
</html>
