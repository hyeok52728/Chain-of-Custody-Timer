<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모의수사경진대회 시스템</title>
    <style>
        body { text-align: center; font-family: 'Arial', sans-serif; padding-top: 80px; background-color: #f4f4f9; }
        .clock-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; min-width: 400px; }
        .status { font-size: 1.5em; font-weight: bold; color: #007bff; margin-bottom: 15px; }
        
        /* 가상 시간 표시부 */
        .virtual-date { font-size: 1.6em; color: #333; font-weight: bold; }
        .virtual-time { font-size: 4.5em; font-weight: bold; color: #d32f2f; margin: 0px 0 25px 0; font-variant-numeric: tabular-nums; }
        
        .real-time { font-size: 1.1em; color: #777; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="status" id="statusText">서버와 연결 중...</div>
        
        <div class="virtual-date" id="virtualDate">0000년 00월 00일</div>
        <div class="virtual-time" id="virtualTime">00:00:00</div>
        
        <div class="real-time">현재 실제 시간: <span id="realTime">로딩중</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // 🔥 본인의 Firebase 설정값으로 변경하세요!
        const firebaseConfig = {
        apiKey: "AIzaSyAwgPkHsoT8QqfU1vxlNhPazlgkJwxgTxA",
        authDomain: "chain-of-custody-53ca7.firebaseapp.com",
        databaseURL: "https://chain-of-custody-53ca7-default-rtdb.firebaseio.com",
        projectId: "chain-of-custody-53ca7",
        storageBucket: "chain-of-custody-53ca7.firebasestorage.app",
        messagingSenderId: "427414747301",
        appId: "1:427414747301:web:9049a7d679cd764b8cb54c",
        measurementId: "G-XGFLK74CFJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let contestData = null;

        const settingsRef = ref(db, 'contestSettings');
        onValue(settingsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // 관리자가 입력한 날짜 데이터를 밀리초(ms)로 변환
                contestData = {
                    realStart: new Date(data.realStart).getTime(),
                    realEnd: new Date(data.realEnd).getTime(),
                    virtualStart: new Date(data.virtualStart).getTime(),
                    virtualEnd: new Date(data.virtualEnd).getTime()
                };
            }
        });

        // 밀리초(ms)를 받아 화면에 날짜와 시간을 찍어주는 함수
        function updateVirtualDisplay(ms) {
            const date = new Date(ms);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');

            document.getElementById('virtualDate').innerText = `${year}년 ${month}월 ${day}일`;
            document.getElementById('virtualTime').innerText = `${hours}:${minutes}:${seconds}`;
        }

        function updateClock() {
            const now = new Date().getTime();
            document.getElementById('realTime').innerText = new Date(now).toLocaleTimeString('ko-KR');

            if (!contestData) return;

            const { realStart, realEnd, virtualStart, virtualEnd } = contestData;
            const virtualTotal = virtualEnd - virtualStart;

            if (now < realStart) {
                document.getElementById('statusText').innerText = "대회 시작 전 대기중";
                updateVirtualDisplay(virtualStart);
            } else if (now > realEnd) {
                document.getElementById('statusText').innerText = "대회 종료";
                updateVirtualDisplay(virtualEnd);
            } else {
                document.getElementById('statusText').innerText = "🚨 수사 진행 중 🚨";
                const realTotal = realEnd - realStart;
                const realElapsed = now - realStart;
                const progressRatio = realElapsed / realTotal; 
                
                const virtualElapsed = virtualTotal * progressRatio;
                const currentVirtualTimeMs = virtualStart + virtualElapsed;

                updateVirtualDisplay(currentVirtualTimeMs);
            }
        }

        setInterval(updateClock, 1000);
    </script>
</body>
</html>
